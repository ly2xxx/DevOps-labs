apiVersion: v1
kind: ConfigMap
metadata:
  name: webserver-configmap
data:
  # =========================================================================
  # USE CASE 1: File-like Configuration (Mounted as Volume: /usr/share/nginx/html/)
  # =========================================================================
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport"
            content="width=device-width,
                     initial-scale=1.0">
      <title>Hello Kubernetes</title>
      <style>
        .tray {
          display: inline-block;
          background-color: LightCoral;
          color: white;
          padding: 10px;
          border-radius: 5px;
        }
      </style>
    </head>
    <body>
      <center>
        <h1 class="tray">Hello, Kuber!</h1>
      </center>
    </body>
    </html>

  # =========================================================================
  # USE CASE 2: Key/Value Scalar Configs (Injected via Environment Variables)
  # =========================================================================
  APP_ENV: "production"
  LOG_LEVEL: "info"
  MAX_CONNECTIONS: "100"
  FEATURE_TOGGLE_NEW_UI: "true"
