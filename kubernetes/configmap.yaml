apiVersion: v1
kind: ConfigMap
metadata:
  name: webserver-configmap
data:
  # =========================================================================
  # USE CASE 1: File-like Configuration (Mounted as Volume: /usr/share/nginx/html/)
  # =========================================================================
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport"
            content="width=device-width,
                     initial-scale=1.0">
      <title>Hello Kubernetes</title>
      <style>
        .tray {
          display: inline-block;
          background-color: LightCoral;
          color: white;
          padding: 10px;
          border-radius: 5px;
        }
      </style>
    </head>
    <body>
      <center>
        <h1 class="tray">Hello, Kubers!</h1>
        <p>Environment: <strong>$APP_ENV</strong></p>
        <p>Max Connections: <strong>$MAX_CONNECTIONS</strong></p>
      </center>
    </body>
    </html>

  docs.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Documentation Page</title>
      <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #eef2f3; color: #333; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Documentation Page 📚</h1>
        <p>Welcome to the <strong>$APP_ENV</strong> environment system documentation!</p>
        <p>Max active connections allowed: <strong>$MAX_CONNECTIONS</strong></p>
      </div>
    </body>
    </html>

  # =========================================================================
  # USE CASE 2: Key/Value Scalar Configs (Injected via Environment Variables)
  # =========================================================================
  APP_ENV: "production"
  LOG_LEVEL: "info"
  MAX_CONNECTIONS: "100"
  FEATURE_TOGGLE_NEW_UI: "true"
